<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Bank Guarantee</title>
</head>
<body>
    <h1>Create Bank Guarantee</h1>
    <form id="bankGuaranteeForm" action="/createBankGuarantee" method="GET">
        <label for="guaranteeNumber">Guarantee Number:</label>
        <input type="text" id="guaranteeNumber" name="guaranteeNumber" required><br>

        <label for="beneficiaryName">Beneficiary Name:</label>
        <input type="text" id="beneficiaryName" name="beneficiaryName" required><br>

        <label for="beneficiaryAddress">Beneficiary Address:</label>
        <input type="text" id="beneficiaryAddress" name="beneficiaryAddress" required><br>

        <label for="applicantName">Applicant Name:</label>
        <input type="text" id="applicantName" name="applicantName" required><br>

        <label for="applicantAddress">Applicant Address:</label>
        <input type="text" id="applicantAddress" name="applicantAddress" required><br>

        <label for="guaranteeAmount">Guarantee Amount:</label>
        <input type="text" id="guaranteeAmount" name="guaranteeAmount" required><br>

        <label for="expiryDate">Expiry Date:</label>
        <input type="date" id="expiryDate" name="expiryDate" required><br>

        <button type="submit">Create Bank Guarantee</button>
    </form>
</body>
</html>
