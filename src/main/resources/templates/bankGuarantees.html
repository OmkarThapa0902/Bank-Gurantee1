<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Guarantees</title>
    <link rel="stylesheet" href="/style.css"> <!-- Link to the CSS file -->
</head>
<body>
    <h1>Bank Guarantees</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Guarantee Number</th>
                <th>Beneficiary Name</th>
                <th>Applicant Name</th>
                <th>Guarantee Amount</th>
                <th>Expiry Date</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="guarantee : ${guarantees}">
                <td th:text="${guarantee.id}"></td>
                <td th:text="${guarantee.guaranteeNumber}"></td>
                <td th:text="${guarantee.beneficiaryName}"></td>
                <td th:text="${guarantee.applicantName}"></td>
                <td th:text="${guarantee.guaranteeAmount}"></td>
                <td th:text="${guarantee.expiryDate}"></td>
                <td th:text="${guarantee.guaranteeStatus}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
